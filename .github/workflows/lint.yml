name: Lint sources

on:
  pull_request:
    paths:
      - "sources/**"
  push:
    branches: [main]
    paths:
      - "sources/**"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: ropensci/bowerbird

      - name: Check for duplicate source ids
        run: Rscript lint-ids.R
