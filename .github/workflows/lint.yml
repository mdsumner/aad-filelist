name: Lint sources

on:
  pull_request:
    paths:
      - "sources/**"
  push:
    branches: [main]
    paths:
      - "sources/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # the R image on ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/${{ github.repository_owner }}/aad-filelist-r:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for duplicate source ids
        run: Rscript lint-ids.R
