name: Build R image

## docker/Dockerfile -> ghcr.io/<owner>/aad-filelist-r, used as the job
## container by sync.yml and lint.yml. Rebuilt when the Dockerfile changes,
## monthly (package updates), or by hand.

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/image.yml"
  schedule:
    - cron: "0 1 1 * *"   # monthly, 1st 01:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aad-filelist-r:latest
            ghcr.io/${{ github.repository_owner }}/aad-filelist-r:${{ github.sha }}
