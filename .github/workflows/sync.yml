name: Sync file listings

## Listing corpus (corpus/README.md): every run keeps its listings.
##   list      one matrix job per sources/*.R: corpus/list.R -> artifact
##   collect   one job: corpus/derive.R folds the run into the corpus and
##             publishes three releases
##               run-<run_id>  this run's files, never rewritten
##               corpus        derived: runs.parquet, matrix.parquet,
##                             current__<id>.parquet, changes__<id>.parquet,
##                             sources__<id>__<hash>.json
##               latest        the old <id>.parquet shape, for existing readers
## Release assets are flat: a "/" in the corpus layout is "__" in an asset name.

on:
  schedule:
    - cron: "0 2 * * 1"   # weekly, Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: "Source(s) to sync, comma separated (e.g. hclim_dmi,oisst_v21_s3). Leave blank for all."
        required: false
        default: ""

permissions:
  contents: write

## one run at a time: collect rewrites the corpus release
concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  list-sources:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.ls.outputs.sources }}
      run_id: ${{ steps.ls.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6
      - id: ls
        shell: bash
        env:
          SOURCES: ${{ github.event.inputs.source }}
        run: |
          echo "run_id=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          ## a manual run takes one source or several, comma separated: one
          ## run per batch, because the corpus group keeps only one run
          ## queued (a second dispatch cancels the first one waiting)
          if [ -n "$SOURCES" ]; then
            names=$(echo "$SOURCES" | tr ', ' '\n\n' | sed '/^$/d' | jq -R . | jq -sc .)
            for s in $(echo "$names" | jq -r '.[]'); do
              [ -f "sources/$s.R" ] || { echo "no sources/$s.R" >&2; exit 1; }
            done
            echo "sources=$names" >> "$GITHUB_OUTPUT"
          else
            names=$(ls sources/*.R | xargs -I{} basename {} .R | jq -R . | jq -sc .)
            echo "sources=$names" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: list-sources
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: ${{ fromJson(needs.list-sources.outputs.sources) }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            ropensci/bowerbird
            nanoparquet
            curl
            xml2
            jsonlite

      - name: Previous current listings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prev
          source corpus/retry.sh
          if gh release view corpus > /dev/null 2>&1; then
            retry gh release download corpus -D prev -p 'current__*.parquet' --clobber
          else
            echo "no corpus release yet"
          fi

      - name: List
        env:
          MIRROR_ROOT: ${{ runner.temp }}/mirror
          CORPUS_RUNNER: gha
        run: |
          Rscript corpus/list.R sources/${{ matrix.source }}.R \
            ${{ needs.list-sources.outputs.run_id }} out prev

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listing-${{ matrix.source }}
          path: out/
          if-no-files-found: ignore

  collect:
    needs: [list-sources, sync]
    if: always() && needs.list-sources.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ needs.list-sources.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            nanoparquet
            curl
            xml2
            jsonlite

      - uses: actions/download-artifact@v4
        with:
          pattern: listing-*
          path: listings
          merge-multiple: true

      ## the corpus tree is built in store/, not corpus/ (that is the code)
      - name: Corpus as it stood
        run: |
          source corpus/retry.sh
          rm -rf flat store && mkdir -p flat store
          if gh release view corpus > /dev/null 2>&1; then
            retry gh release download corpus -D flat --clobber -p '*.parquet' -p 'sources__*.json'
          else
            echo "no corpus release yet: first run"
          fi
          bash corpus/flat.sh unflat flat store

      - name: Derive
        env:
          CORPUS_RUN_BASE: https://github.com/${{ github.repository }}/releases/download
        run: Rscript corpus/derive.R "$RUN_ID" listings store run

      - name: Publish run-${{ env.RUN_ID }}
        run: |
          source corpus/retry.sh
          rm -rf runflat && mkdir -p runflat
          bash corpus/flat.sh flat run runflat
          ## a retried create can succeed server side and still report an
          ## error, so create only if absent, then upload
          gh release view "run-$RUN_ID" > /dev/null 2>&1 || \
            retry gh release create "run-$RUN_ID" --title "Corpus run $RUN_ID" \
              --notes "Listings of run $RUN_ID (corpus/README.md). Never rewritten." --latest=false || \
            gh release view "run-$RUN_ID" > /dev/null
          retry gh release upload "run-$RUN_ID" runflat/* --clobber

      - name: Publish corpus
        run: |
          source corpus/retry.sh
          rm -rf flat && mkdir -p flat
          bash corpus/flat.sh flat store flat
          gh release view corpus > /dev/null 2>&1 || \
            retry gh release create corpus --title "Listing corpus (derived)" \
              --notes "runs.parquet, matrix.parquet, current__<id>, changes__<id>, sources__<id>__<hash>. Rebuilt every run (corpus/README.md)." --latest=false || \
            gh release view corpus > /dev/null
          ## per-source tables first, runs.parquet and matrix.parquet last: a
          ## reader that sees this run in runs.parquet sees its tables too
          for f in flat/*; do
            case "$(basename "$f")" in runs.parquet|matrix.parquet) continue ;; esac
            retry gh release upload corpus "$f" --clobber
          done
          for f in flat/runs.parquet flat/matrix.parquet; do
            [ -f "$f" ] && retry gh release upload corpus "$f" --clobber
          done
          ## drop assets that are not corpus tables (e.g. strays from an old run)
          gh release view corpus --json assets -q '.assets[].name' | \
            grep -Ev '^(runs|matrix)\.parquet$|^(current|changes)__.*\.parquet$|^sources__.*\.json$' | \
            while read -r a; do
              echo "deleting stray asset $a"
              retry gh release delete-asset corpus "$a" -y
            done || true

      - name: Publish latest (old shape)
        run: |
          ls listings/legacy/*.parquet > /dev/null 2>&1 || exit 0
          source corpus/retry.sh
          gh release view latest > /dev/null 2>&1 || \
            retry gh release create latest --title "Latest file listings" --notes "Latest file listings, updated by sync.yml"
          retry gh release upload latest listings/legacy/*.parquet --clobber
