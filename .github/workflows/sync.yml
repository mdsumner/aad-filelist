name: Sync file listings

## Listing corpus (corpus/README.md): every run keeps its listings.
##   list      one matrix job per sources/*.R: corpus/list.R -> artifact
##   collect   one job: corpus/derive.R folds the run into the corpus and
##             publishes three releases
##               run-<run_id>  this run's files, never rewritten
##               corpus        derived: runs.parquet, matrix.parquet,
##                             current__<id>.parquet, changes__<id>.parquet,
##                             sources__<id>__<hash>.json
##               latest        the old <id>.parquet shape, for existing readers
## Release assets are flat: a "/" in the corpus layout is "__" in an asset name.

on:
  schedule:
    - cron: "0 2 * * 1"   # weekly, Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: "Single source to sync (e.g. hclim_dmi). Leave blank for all."
        required: false
        default: ""

permissions:
  contents: write

## one run at a time: collect rewrites the corpus release
concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  list-sources:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.ls.outputs.sources }}
      run_id: ${{ steps.ls.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6
      - id: ls
        shell: bash
        run: |
          echo "run_id=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.inputs.source }}" ]; then
            echo "sources=[\"${{ github.event.inputs.source }}\"]" >> "$GITHUB_OUTPUT"
          else
            names=$(ls sources/*.R | xargs -I{} basename {} .R | jq -R . | jq -sc .)
            echo "sources=$names" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: list-sources
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: ${{ fromJson(needs.list-sources.outputs.sources) }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            ropensci/bowerbird
            nanoparquet
            curl
            xml2
            jsonlite

      - name: Previous current listings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prev
          gh release download corpus -D prev -p 'current__*.parquet' || echo "no corpus release yet"

      - name: List
        env:
          MIRROR_ROOT: ${{ runner.temp }}/mirror
          CORPUS_RUNNER: gha
        run: |
          Rscript corpus/list.R sources/${{ matrix.source }}.R \
            ${{ needs.list-sources.outputs.run_id }} out prev

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listing-${{ matrix.source }}
          path: out/
          if-no-files-found: ignore

  collect:
    needs: [list-sources, sync]
    if: always() && needs.list-sources.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ needs.list-sources.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            nanoparquet
            curl
            xml2
            jsonlite

      - uses: actions/download-artifact@v4
        with:
          pattern: listing-*
          path: listings
          merge-multiple: true

      - name: Corpus as it stood
        run: |
          mkdir -p flat corpus
          gh release download corpus -D flat || echo "no corpus release yet: first run"
          bash corpus/flat.sh unflat flat corpus

      - name: Derive
        run: Rscript corpus/derive.R "$RUN_ID" listings corpus run

      - name: Publish run-${{ env.RUN_ID }}
        run: |
          mkdir -p runflat
          bash corpus/flat.sh flat run runflat
          gh release create "run-$RUN_ID" runflat/* --title "Corpus run $RUN_ID" \
            --notes "Listings of run $RUN_ID (corpus/README.md). Never rewritten." --latest=false

      - name: Publish corpus
        run: |
          rm -rf flat && mkdir -p flat
          bash corpus/flat.sh flat corpus flat
          gh release view corpus > /dev/null 2>&1 || \
            gh release create corpus --title "Listing corpus (derived)" \
              --notes "runs.parquet, matrix.parquet, current__<id>, changes__<id>, sources__<id>__<hash>. Rebuilt every run (corpus/README.md)." --latest=false
          gh release upload corpus flat/* --clobber

      - name: Publish latest (old shape)
        run: |
          ls listings/legacy/*.parquet > /dev/null 2>&1 || exit 0
          gh release view latest > /dev/null 2>&1 || \
            gh release create latest --title "Latest file listings" --notes "Latest file listings, updated by sync.yml"
          gh release upload latest listings/legacy/*.parquet --clobber
